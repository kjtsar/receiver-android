apply plugin: 'com.android.application'
android {
    def versionMajor = 3
    def versionMinor = 6
    def versionPatch = 1
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.opendroneid.android"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def buildTime = new Date()
        buildConfigField "String", "BUILD_TIME", "\"${buildTime.format('ddLLLyyyy:HHmmss')}\""
    }
    buildTypes {
        debug {
            versionNameSuffix ".debug"
            resValue "string", "app_version", "${defaultConfig.versionName}${versionNameSuffix}"

            if (project.hasProperty('org.gradle.project.map')) {
                buildConfigField "boolean", "USE_GOOGLE_MAPS", "true"
            } else {
                buildConfigField "boolean", "USE_GOOGLE_MAPS", "false"
            }

            if (project.hasProperty('storePassword')) {
                buildConfigField("String", "STORE_PASSWORD", storePassword)
                buildConfigField("String", "STORE_FILE", storeFile)
            }
            signingConfig signingConfigs.debug
        }

        release {
            resValue "string", "app_version", "${defaultConfig.versionName}"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (project.hasProperty('org.gradle.project.map')) {
                buildConfigField "boolean", "USE_GOOGLE_MAPS", "true"
            } else {
                buildConfigField "boolean", "USE_GOOGLE_MAPS", "false"
            }
        }
    }
    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }
    namespace 'org.opendroneid.android'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    def support_version = "30.0.0"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.mikepenz:fastadapter:3.3.1'
    implementation 'com.mikepenz:fastadapter-commons:3.3.1'
    implementation 'com.android.support:recyclerview-v7:' + support_version
    implementation 'com.android.support:appcompat-v7:' + support_version
    implementation 'com.android.support:support-fragment:' + support_version
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.2.1'
    implementation 'com.squareup.okhttp3:mockwebserver:5.2.1'
    implementation 'com.squareup.okhttp3:okhttp-tls:5.2.1'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

//    The below if-else works, but will then fail to compile the AircraftMapView.java or
//    AircraftOsMapView.java file. How to properly variate this is unclear.
//    if (project.hasProperty('org.gradle.project.map')) {
        implementation 'com.google.android.gms:play-services-maps:19.2.0'
        implementation 'com.google.android.gms:play-services-location:21.3.0'
//    } else {
        implementation 'androidx.preference:preference:1.2.1'
        implementation 'org.osmdroid:osmdroid-android:6.1.20'
//    }
}
